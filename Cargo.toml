[package]
name = "clawdguard"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
authors = ["ClawdGuard Contributors"]
description = "🦞 Security hardening for Clawdbot/Moltbot. Detects and fixes exposed gateways automatically."
license = "MIT"
repository = "https://github.com/fadidevv/clawdguard"
keywords = ["security", "hardening", "moltbot", "clawdbot", "vulnerability"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
comfy-table = "7.1"
indicatif = { version = "0.17", features = ["rayon"] }
anyhow = "1.0"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sysinfo = "0.30"
local-ip-address = "0.6"
ctrlc = "3.4"

[[bin]]
name = "clawdguard"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
